[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pesaranpy"
version = "0.1.0"
description = "Estimadores MG e PMG de Pesaran para painéis cointegrados"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "wooldridge",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pesaranpy*"]
